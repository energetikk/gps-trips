name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже установлен на ubuntu-latest; ANDROID_HOME задан образом.
      - name: Build and test
        env:
          # Ключ MapKit не хранится в репозитории: добавьте секрет MAPKITSDK
          # в настройках репозитория (Settings → Secrets and variables → Actions).
          MAPKITSDK: ${{ secrets.MAPKITSDK }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: gps-trips-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
